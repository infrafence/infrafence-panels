# WHM AppConfig for the InfraFence plugin.
# Installed to /usr/local/share/infrafence-whm/infrafence.conf and registered with
# /usr/local/cpanel/bin/register_appconfig, which copies it to /var/cpanel/apps/.
name=infrafence
service=whostmgr
user=root
acls=all
url=/cgi/infrafence/index.cgi
entryurl=infrafence/index.cgi
displayname=InfraFence
icon=infrafence.png
target=_self
searchtext=InfraFence security firewall bans allow list malware scan
