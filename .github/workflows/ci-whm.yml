name: CI WHM plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ci-whm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit, controller and rendering tests
        run: make -C whm test
